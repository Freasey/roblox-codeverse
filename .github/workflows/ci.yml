name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rokit
        run: |
          ROKIT_VERSION=1.2.0
          curl -fsSL -o rokit.zip \
            "https://github.com/rojo-rbx/rokit/releases/download/v${ROKIT_VERSION}/rokit-${ROKIT_VERSION}-linux-x86_64.zip"
          unzip -q rokit.zip -d /tmp/rokit
          chmod +x /tmp/rokit/rokit
          /tmp/rokit/rokit self-install
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"

      - name: Install project tools
        run: rokit install --no-trust-check

      - name: Install Wally dependencies
        run: wally install

      - name: Check formatting
        run: stylua --check src/ tests/

      - name: Lint
        run: |
          selene generate-roblox-std
          selene src/

      - name: Type check
        run: |
          rojo sourcemap default.project.json --output sourcemap.json
          # Tag-nya disamakan dengan versi luau-lsp di rokit.toml. Kalau
          # ditarik dari branch main upstream, hasil type check bisa berubah
          # tanpa ada satu baris pun di repo ini yang berubah.
          curl -fsSL -o globalTypes.d.luau \
            https://raw.githubusercontent.com/JohnnyMorganz/luau-lsp/1.70.1/scripts/globalTypes.d.luau
          luau-lsp analyze \
            --sourcemap=sourcemap.json \
            --definitions=globalTypes.d.luau \
            --settings=.vscode/settings.json \
            --ignore="Packages/**" \
            src/

      - name: Unit tests
        run: lune run tests/run

      - name: Build place
        run: |
          mkdir -p build
          rojo build default.project.json --output build/codeverse.rbxl

      - uses: actions/upload-artifact@v4
        with:
          name: codeverse-rbxl
          path: build/codeverse.rbxl
